# CareConnect SPA — production-style serving (container only; dev uses ng serve).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers ---------------------------------------------------
    # always: also apply to error responses, which is where they are usually
    # missed. add_header in a location block REPLACES these, so any location
    # needing its own headers must repeat the ones it still wants.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Clickjacking defence for browsers that honour CSP; X-Frame-Options is the
    # fallback for those that don't.
    #
    # style-src needs 'unsafe-inline' and that is not laziness: Angular injects
    # component styles as inline <style> elements and Angular Material sets
    # inline custom properties, so a nonce-based style policy would break the
    # entire UI. Scripts are bundled locally and get no such exemption —
    # script-src stays 'self', which is what actually stops injected JS.
    # Fonts come from Google (see index.html), hence the two font hosts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # No HSTS here: this listener is plain HTTP behind whatever terminates TLS.
    # Sending Strict-Transport-Security from an HTTP origin is ignored by
    # browsers, and setting it at the wrong layer would be cargo cult. It
    # belongs on the TLS terminator, together with the HTTP->HTTPS redirect.

    # SPA fallback: Angular router owns the paths, nginx serves the shell
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Server-Sent Events for the live queue. Longest-prefix match wins, so this
    # is chosen over /api/ below.
    #
    # This block is not optional decoration — with the generic /api/ settings the
    # live queue silently does not work in the container. nginx buffers upstream
    # responses by default, so an event stream is held instead of forwarded and
    # the board only updates when the buffer happens to flush; and the 60s
    # default read timeout kills an idle stream, which for a waiting-room board
    # is most of the day. The behaviour differs from `ng serve` (which proxies
    # without buffering), which is exactly why it went unnoticed.
    location /api/queue/stream/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;         # SSE needs keep-alive; 1.0 closes each response
        proxy_set_header Connection '';  # clear "close" so the connection stays open
        proxy_buffering off;             # forward each event immediately
        proxy_cache off;
        proxy_read_timeout 3600s;        # a lobby board holds one stream all day

        # Deliberately NOT setting chunked_transfer_encoding off, which several
        # SSE guides recommend: chunked encoding is how HTTP/1.1 frames a
        # response of unknown length, so disabling it forces nginx to signal the
        # end by closing the connection instead. proxy_buffering off is what
        # actually makes the stream flow.
        #
        # Tells a proxy in front of this one (a TLS terminator, say) not to
        # re-buffer what we just unbuffered.
        add_header X-Accel-Buffering "no" always;
        # This block's own add_header discards the server-level set. Only nosniff
        # is repeated: CSP and frame-options govern documents, and this is a data
        # stream, not a page.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Same-origin API: the browser talks to nginx, nginx talks to the gateway
    # over the compose network — no CORS in the container setup at all.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static asset caching (hashed filenames make this safe)
    location ~* \.(js|css|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Repeated deliberately: this block's own add_header discards the
        # server-level ones, and serving scripts without nosniff is the case
        # where content-type confusion actually matters.
        add_header X-Content-Type-Options "nosniff" always;
    }
}
