server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native          # filesystem/classpath instead of git (ADR-006)
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config-repo

# Config-server serves the config-repo but does not consume it, so its own
# Eureka settings live here. Registration retries in the background if the
# discovery-server isn't up yet (startup order is not a hard dependency).
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
