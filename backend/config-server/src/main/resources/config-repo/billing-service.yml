server:
  port: 8086

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/careconnect_billing
    username: ${POSTGRES_USER:careconnect}
    password: ${POSTGRES_PASSWORD:careconnect}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true      # every Feign call runs inside a Resilience4j circuit breaker
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        # A 404 is the downstream answering correctly, not failing. Counting it
        # would let a normal condition open the breaker: every user who has
        # registered but not yet created a patient profile produces a 404 on
        # each screen, so a handful of new users at once would trip the breaker
        # and make a perfectly healthy service unavailable to everyone.
        #
        # The breaker exists for a dependency that is down or slow. Client
        # errors are neither, so they are ignored here and translated to the
        # right status by platform-starter's DownstreamFailureAdvice.
        ignore-exceptions:
          - feign.FeignException$NotFound
          - feign.FeignException$BadRequest
          - feign.FeignException$Forbidden
  timelimiter:
    configs:
      default:
        timeout-duration: 8s   # see appointment-service.yml for why 8s locally
