server:
  port: 8761

eureka:
  client:
    # A standalone registry neither registers with itself nor fetches from itself.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Dev-friendly: evict dead instances quickly instead of entering self-preservation.
    # In production with real traffic, self-preservation stays ON (see interview notes).
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 15000
    # Dev: registry responses cached 5s instead of 30s — faster propagation.
    response-cache-update-interval-ms: 5000
