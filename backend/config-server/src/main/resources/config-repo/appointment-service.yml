server:
  port: 8084

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/careconnect_appointment
    username: ${POSTGRES_USER:careconnect}
    password: ${POSTGRES_PASSWORD:careconnect}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true      # every Feign call runs inside a Resilience4j circuit breaker
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50      # open after 5 of 10 calls fail
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        # Local dev runs ~13 JVMs at once on a laptop with JIT capped at C1
        # (see docker-compose.yml) — steady-state execution is slower than a
        # fully warmed C2-optimized JVM, so 4s occasionally trips under load
        # that isn't a real provider-service outage. Still fail-fast, just
        # calibrated to this environment (ADR-004 doesn't mandate a value).
        timeout-duration: 8s

careconnect:
  clinic:
    zone: ${CLINIC_ZONE:Asia/Kolkata}   # availability times are clinic-local; storage is UTC
