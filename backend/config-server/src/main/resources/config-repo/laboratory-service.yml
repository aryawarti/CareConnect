server:
  port: 8089

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/careconnect_laboratory
    username: ${POSTGRES_USER:careconnect}
    password: ${POSTGRES_PASSWORD:careconnect}
  mvc:
    async:
      # SSE streams stay open; the default async timeout would kill them.
      request-timeout: -1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true      # every Feign call runs inside a Resilience4j circuit breaker
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        timeout-duration: 8s   # see appointment-service.yml for why 8s locally

