spring:
  application:
    name: api-gateway
  config:
    # configtree reads file-mounted secrets (one file per value) into the
    # Environment, so ${JWT_SECRET} and friends resolve from /run/secrets/
    # without any code change. Docker and Kubernetes both mount secrets this
    # way, which is the point: the K8s migration changes the mount, not the app.
    # `optional:` keeps dev, tests and a bare `spring-boot:run` working, where
    # the directory does not exist. See docs/adr/adr-011-deployment-topology.md
    import:
      - "optional:configtree:/run/secrets/"
      - "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

# Canonical gateway config (routes, CORS, default-filters) lives in the
# config-repo (api-gateway.yml) — single source of truth. Only bootstrap
# concerns belong in this file.
server:
  port: 8080

# Fallbacks for running without config-server (tests, cold start). The
# config-repo values are canonical and override these when available.
careconnect:
  jwt:
    secret: ${JWT_SECRET:careconnect-local-dev-secret-key-please-override-1234}
  security:
    allow-insecure-defaults: ${ALLOW_INSECURE_DEFAULTS:false}
  platform:
    gateway-secret: ${GATEWAY_SHARED_SECRET:}
  gateway:
    public-paths: /api/auth/register,/api/auth/login,/api/auth/refresh,/api/auth/logout,/api/providers/directory/**,/api/providers/departments,/api/queue/stream/**,/api/queue/board/**,/api/_platform/**
    rate-limit:
      enabled: true
      rules:
        "[/api/auth/login]": 20
        "[/api/auth/register]": 20
        "[/api/auth/refresh]": 60
