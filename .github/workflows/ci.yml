name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first — no point finishing a run
# whose result is already stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (JDK 21, Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The point of running this here rather than trusting a laptop: GitHub's
      # ubuntu runners have Docker, so the Testcontainers tests actually execute.
      # Locally they are annotated `disabledWithoutDocker` and skip silently,
      # which means a green local run proves considerably less than it looks
      # like — and the concurrency and event-pipeline tests are exactly the ones
      # that skip. This job is where they really run.
      - name: Confirm Docker is available to Testcontainers
        run: docker info --format 'Docker {{.ServerVersion}}'

      - name: Build and test
        working-directory: backend
        run: ./mvnw --batch-mode verify

      # Guard against this job going green for the same misleading reason a
      # laptop does. Docker is present here, so nothing should skip.
      - name: Assert no tests were skipped
        working-directory: backend
        run: |
          skipped=$(grep -ho 'skipped="[0-9]*"' */target/surefire-reports/TEST-*.xml \
                    | grep -o '[0-9]*' | awk '{n+=$1} END {print n+0}')
          echo "Skipped tests: $skipped"
          if [ "$skipped" -gt 0 ]; then
            echo "::error::$skipped test(s) skipped despite Docker being available."
            grep -l 'skipped="[1-9]' */target/surefire-reports/TEST-*.xml || true
            exit 1
          fi

      # Surefire's failure detail lives in files nobody opens. Echoing it as
      # ::error:: annotations puts the actual assertion on the run summary and
      # the PR diff, so a red build says *what* broke without downloading an
      # artifact first.
      - name: Report test failures
        if: failure()
        working-directory: backend
        run: |
          shopt -s nullglob
          for f in */target/surefire-reports/*.txt; do
            if grep -qE '<<< (FAILURE|ERROR)' "$f"; then
              echo "::group::$f"
              cat "$f"
              echo "::endgroup::"
              detail=$(grep -A4 -E '<<< (FAILURE|ERROR)' "$f" | head -20 \
                       | tr '\n' ' ' | sed 's/::/;;/g' | cut -c1-900)
              echo "::error title=$(basename "$f" .txt)::${detail}"
            fi
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/*/target/surefire-reports/
          retention-days: 7

      # Handed to the publish job so images are built from the exact jars that
      # were just tested, rather than rebuilt from source and hoped to match.
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: backend/*/target/*.jar
          retention-days: 1

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # Separate from the build on purpose: tsc is the stricter check on the
      # TypeScript itself, and its errors point at the real file rather than a
      # bundling stage.
      - name: Typecheck
        working-directory: frontend
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  compose:
    name: Compose config is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cheap, and catches the class of mistake that only surfaces when someone
      # tries to start the stack: a broken anchor, or a deleted service still
      # named in another service's depends_on.
      # docker-compose.prod.yml uses ${VAR:?} guards and file-backed secrets so a
      # real deployment cannot start without them. Both make `config` fail here
      # too, which is the guard working — so supply throwaway values and dummy
      # secret files to validate the *structure*.
      - name: Create throwaway secret files
        run: |
          mkdir -p ./secrets
          for s in JWT_SECRET POSTGRES_PASSWORD GATEWAY_SHARED_SECRET SEED_ADMIN_PASSWORD; do
            printf 'ci-validation-only' > "./secrets/$s"
          done

      - name: Validate compose files
        env:
          POSTGRES_USER: ci
          GATEWAY_SHARED_SECRET: ci-validation-only
          JWT_SECRET: ci-validation-only-not-a-real-secret
          SEED_ADMIN_PASSWORD: ci-validation-only
          POSTGRES_PASSWORD: ci
          CORS_ALLOWED_ORIGINS: https://ci.invalid
          CARECONNECT_DOMAIN: ci.invalid
          ACME_EMAIL: ci@ci.invalid
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
          # The deployed combination, not just the pieces: an overlay can be
          # valid alone and still collide with the file it merges into.
          docker compose -f docker-compose.prod.yml -f docker-compose.edge.yml config --quiet
          # The demo profile is opt-in, so nothing else here would ever parse it.
          docker compose -f docker-compose.prod.yml --profile demo config --quiet
          echo "compose files are valid"

      # These run unattended on a VM where nobody sees a syntax error until the
      # backup silently never happens.
      - name: Shellcheck deployment scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck infra/postgres/backup.sh infra/secrets/generate.sh

  publish:
    name: Publish images to GHCR
    needs: [backend, frontend, compose]
    # Only for real deliveries, and only after the tests above passed. A pull
    # request must never publish an image.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The Dockerfiles are runtime-only by design (ADR note in each): they COPY
      # a jar or a dist folder that already exists. So CD reuses the artifacts
      # the test jobs produced instead of rebuilding — which also guarantees the
      # published image contains exactly what was tested.
      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: backend/

      - name: Download frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      # Images are built for arm64 as well as amd64 because the deployment
      # target is an Oracle Cloud Always Free A1 instance, which is ARM. An
      # amd64-only manifest does not start there at all.
      #
      # Cross-building is nearly free *because* the Dockerfiles are runtime-only:
      # they COPY a jar that CI already produced and set an ENTRYPOINT, so no
      # compilation happens under emulation. A multi-stage in-image Maven build
      # would make this step brutally slow under QEMU — another reason that
      # decision (see the Dockerfile header comments) keeps paying off.
      #
      # Both architectures, not arm64-only: one manifest then runs on the ARM VM,
      # on an x86 laptop, and on x86 ECS/EKS nodes later. Pinning to arm64 would
      # swap one lock-in for another.
      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all images
        env:
          # GHCR rejects uppercase in a repository path, and GitHub usernames
          # may contain it.
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          PLATFORMS: linux/amd64,linux/arm64
        run: |
          set -euo pipefail
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          services="api-gateway config-server discovery-server identity-service \
                    patient-service provider-service appointment-service \
                    notification-service medical-record-service billing-service \
                    queue-service"

          push_image() {
            local name="$1" context="$2" dockerfile="$3"
            local repo="ghcr.io/${owner}/careconnect-${name}"
            echo "::group::${name}"
            # buildx builds and pushes in one step: a multi-arch image cannot be
            # held in the local docker image store, so the `build then push`
            # split used for single-arch does not apply here.
            docker buildx build \
              --platform "$PLATFORMS" \
              -t "${repo}:${SHA}" \
              -f "${dockerfile}" \
              --push \
              "${context}"

            # Moving tags, applied only after the immutable SHA tag is safely up.
            # `imagetools create` retags the manifest that was just pushed — it
            # copies no layers and rebuilds nothing, so the moving tag is
            # guaranteed to point at the exact bytes tested above. (`docker tag`
            # would not work: there is no local image to tag.)
            local moving
            if [ "$IS_TAG" = "true" ]; then moving="$REF_NAME"; else moving="latest"; fi
            docker buildx imagetools create -t "${repo}:${moving}" "${repo}:${SHA}"
            echo "::endgroup::"
          }

          for svc in $services; do
            push_image "$svc" backend "backend/${svc}/Dockerfile"
          done
          push_image frontend frontend frontend/Dockerfile

      - name: Summarise what was published
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          {
            echo "### Images published"
            echo ""
            echo "Tag: \`${SHA}\`  ·  Architectures: \`linux/amd64\`, \`linux/arm64\`"
            echo ""
            echo "Run the published stack with:"
            echo ""
            echo '```bash'
            echo "export CARECONNECT_REGISTRY=ghcr.io/${owner}"
            echo "export CARECONNECT_TAG=${SHA}"
            echo "docker compose -f docker-compose.prod.yml -f docker-compose.edge.yml up -d"
            echo '```'
            echo ""
            echo "Verify both architectures are in the manifest:"
            echo ""
            echo '```bash'
            echo "docker buildx imagetools inspect ghcr.io/${owner}/careconnect-api-gateway:${SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to the VM
    needs: publish
    # main only, and only if a real deployment target is configured. The `if` on
    # VM_HOST means a fork, or this repository before anyone has provisioned a
    # VM, skips this job instead of failing red for a machine that never existed.
    if: github.ref == 'refs/heads/main' && vars.VM_HOST != ''
    runs-on: ubuntu-latest
    # A GitHub Environment, so the SSH key is scoped to it rather than readable
    # by every workflow in the repository, and deployments get an audit trail.
    environment:
      name: production
      url: https://${{ vars.CARECONNECT_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Open an SSH session to the VM
        env:
          KEY: ${{ secrets.VM_SSH_KEY }}
          HOST: ${{ vars.VM_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinning the host key rather than StrictHostKeyChecking=no: without
          # it, this pipeline would hand a deploy key to whatever answers on that
          # address, which is the whole attack. Capture it once during setup with
          # `ssh-keyscan -t ed25519 <host>` and store it as VM_SSH_HOST_KEY.
          printf '%s\n' "${{ secrets.VM_SSH_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Compose files are configuration and travel with the repository; only the
      # images come from GHCR. Copying them per-deploy rather than running a
      # `git pull` on the VM keeps the VM free of a checkout, credentials and a
      # branch that can drift from what was actually tested.
      - name: Ship the deployment files
        env:
          HOST: ${{ vars.VM_HOST }}
          USER_NAME: ${{ vars.VM_USER }}
          DIR: ${{ vars.VM_APP_DIR }}
        run: |
          set -euo pipefail
          tar czf deploy.tgz \
            docker-compose.prod.yml docker-compose.edge.yml \
            infra/caddy infra/postgres infra/seed infra/secrets
          scp -i ~/.ssh/id_ed25519 deploy.tgz "$USER_NAME@$HOST:$DIR/deploy.tgz"

      - name: Roll the stack forward
        env:
          HOST: ${{ vars.VM_HOST }}
          USER_NAME: ${{ vars.VM_USER }}
          DIR: ${{ vars.VM_APP_DIR }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          # Deploying the SHA tag, never `latest`: the running version is then
          # always identifiable, and a rollback is re-running this job at an
          # older commit rather than hoping a moving tag still points somewhere
          # sensible.
          ssh -i ~/.ssh/id_ed25519 "$USER_NAME@$HOST" \
            "CARECONNECT_REGISTRY=ghcr.io/${owner} CARECONNECT_TAG=${SHA} DIR=${DIR} bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DIR"
          tar xzf deploy.tgz && rm -f deploy.tgz

          export CARECONNECT_REGISTRY CARECONNECT_TAG
          COMPOSE="docker compose -f docker-compose.prod.yml -f docker-compose.edge.yml"

          # Pull first, start second. Pulling twelve images inside `up` would
          # leave the stack half-old and half-new for the length of the download
          # if the network is slow; this way the swap is as short as it can be.
          $COMPOSE pull --quiet
          $COMPOSE up -d --remove-orphans

          # Untagged layers from previous deployments, which otherwise accumulate
          # until the boot volume is full. Not `-a`: that would also remove the
          # images belonging to the `demo` profile when it is not running.
          docker image prune -f
          REMOTE

      # A deploy that "succeeded" because SSH exited 0 has proven nothing. This
      # asks the public URL, through the real certificate, whether the platform
      # actually came back — and fails the job if it did not, so the run history
      # reflects reality.
      - name: Smoke test the public URL
        env:
          DOMAIN: ${{ vars.CARECONNECT_DOMAIN }}
        run: |
          set -euo pipefail
          # The gateway chain is the slowest thing to recover; give it time
          # rather than declaring failure while it is still starting.
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "https://$DOMAIN/api/_platform/config-health" >/dev/null; then
              echo "healthy after ${attempt} attempt(s)"
              curl -fsS "https://$DOMAIN/api/_platform/config-health"
              exit 0
            fi
            echo "attempt ${attempt}: not ready yet"
            sleep 20
          done
          echo "::error::Deployment did not become healthy within 10 minutes"
          exit 1

      - name: Summarise the deployment
        if: always()
        env:
          DOMAIN: ${{ vars.CARECONNECT_DOMAIN }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- **URL:** https://${DOMAIN}"
            echo "- **Version:** \`${SHA}\`"
            echo "- **Rollback:** re-run this workflow from an earlier commit on main"
          } >> "$GITHUB_STEP_SUMMARY"
